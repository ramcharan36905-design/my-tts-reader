<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro TTS Reader</title>
    <style>
        :root {
            --bg-color: #0b1120;
            --panel-bg: #1e293b;
            --text-main: #ffffff; /* Pure white text */
            --accent: #3b82f6;
            --arrow-color: #ef4444; 
        }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            margin: 0; padding: 0; background-color: var(--bg-color); color: var(--text-main);
            height: 100vh; display: flex; flex-direction: column; overflow: hidden;
        }

        /* --- MAIN LAYOUT --- */
        .main-container { display: flex; flex: 1; overflow: hidden; position: relative; }
        
        /* LEFT: Reading Area */
        .reader-pane { 
            flex: 1; position: relative; overflow-y: auto; padding: 40px 60px; 
            scroll-behavior: smooth;
        }
        
        /* Lines - Now fully clickable and visible */
        .line { 
            display: block; 
            line-height: 1.8; 
            margin-bottom: 12px;
            padding: 4px 10px 4px 35px; 
            position: relative;
            transition: color 0.2s, background-color 0.2s;
            cursor: pointer;
            border-radius: 6px;
            color: #94a3b8; /* Unread text is light grey */
        }
        
        .line:hover { 
            background-color: rgba(255, 255, 255, 0.1); 
            color: #ffffff;
        }
        
        /* Show a ghost arrow on hover to indicate it's clickable */
        .line:hover::before {
            content: "➤";
            color: #64748b;
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 14px;
        }
        
        /* Active Reading Line */
        .line.active { 
            color: var(--text-main); 
            background-color: rgba(59, 130, 246, 0.15); 
        }
        
        /* Solid Red Arrow for active line */
        .line.active::before {
            content: "➤";
            color: var(--arrow-color);
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 18px;
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            from { opacity: 0.7; transform: translateY(-50%) scale(0.9); }
            to { opacity: 1; transform: translateY(-50%) scale(1.1); }
        }

        /* RIGHT: Notes */
        .resizer { width: 6px; background: #334155; cursor: col-resize; transition: background 0.2s; }
        .resizer:hover { background: var(--accent); }
        
        .notes-pane { 
            width: 300px; min-width: 150px; max-width: 800px; background: var(--panel-bg); 
            display: flex; flex-direction: column; padding: 20px; box-shadow: -5px 0 15px rgba(0,0,0,0.2);
        }
        .notes-pane h3 { margin-top: 0; font-size: 16px; color: #cbd5e1; margin-bottom: 10px; }
        #notesArea {
            flex: 1; width: 100%; background: #0b1120; color: #fff; border: 1px solid #334155;
            border-radius: 8px; padding: 15px; resize: none; font-size: 16px; line-height: 1.5;
        }
        #notesArea:focus { outline: 2px solid var(--accent); }

        /* --- INPUT SECTION --- */
        #inputSection { 
            display: flex; flex-direction: column; flex: 1; padding: 30px; max-width: 800px; margin: 0 auto; width: 100%; box-sizing: border-box; 
        }
        textarea#inputText {
            width: 100%; box-sizing: border-box; font-size: 16px; padding: 15px;
            border: 1px solid #334155; border-radius: 8px; background: #1e293b;
            color: #fff; resize: none; flex: 1; margin-bottom: 15px;
        }
        button.primary { 
            padding: 15px; font-size: 18px; font-weight: 600; cursor: pointer; 
            border: none; border-radius: 8px; background: var(--accent); color: white; 
        }
        button.primary:hover { background: #2563eb; }
        button.primary:disabled { background: #475569; cursor: not-allowed; }

        /* --- FLOATING CONTROLS --- */
        .floating-controls {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(30, 41, 59, 0.95); backdrop-filter: blur(10px);
            padding: 10px 20px; border-radius: 50px; border: 1px solid #334155;
            display: none; align-items: center; gap: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            z-index: 1000; flex-wrap: wrap; justify-content: center;
        }
        audio { height: 36px; border-radius: 18px; outline: none; }
        audio::-webkit-media-controls-panel { background-color: #f1f5f9; }

        .control-group { display: flex; align-items: center; gap: 8px; }
        .btn { background: #475569; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 600;}
        .btn:hover { background: #64748b; }
        
        input[type="range"] { -webkit-appearance: none; width: 80px; height: 6px; background: #334155; border-radius: 5px; outline: none; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--accent); cursor: pointer; }
        .speed-display { font-weight: bold; color: var(--accent); font-size: 14px; min-width: 40px; text-align: right;}

        details summary { cursor: pointer; color: #94a3b8; font-size: 14px; margin-bottom: 10px; }
        
        /* Mobile */
        @media (max-width: 768px) {
            .main-container { flex-direction: column; }
            .resizer { display: none; }
            .notes-pane { width: 100% !important; height: 30vh; }
            .floating-controls { border-radius: 12px; width: 90%; bottom: 10px; gap: 10px; }
            input[type="range"] { width: 60px; }
            .reader-pane { padding: 20px 20px; }
        }
    </style>
</head>
<body>

    <!-- INPUT SCREEN -->
    <div id="inputSection">
        <details open>
            <summary>⚙️ API Settings (Required)</summary>
            <div style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; background: #1e293b; padding: 15px; border-radius: 8px;">
                <input type="text" id="workerUrl" placeholder="https://my-edge-tts.xyz.workers.dev" style="padding: 10px; border-radius: 6px; border: 1px solid #334155; background: #0b1120; color: white;">
                <input type="password" id="apiKey" placeholder="API Key (Password)" style="padding: 10px; border-radius: 6px; border: 1px solid #334155; background: #0b1120; color: white;">
                <button id="saveSettings" style="padding: 10px 20px; background: #10b981; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold;">Save API Settings</button>
                <div id="settingsStatus" style="font-size: 13px; color: #10b981; margin-top: 5px;"></div>
            </div>
        </details>

        <select id="voiceSelect" style="width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 6px; background: #1e293b; color: white; border: 1px solid #334155;">
            <optgroup label="🇺🇸 US English">
                <option value="en-US-AriaNeural">Aria (Female, Natural)</option>
                <option value="en-US-GuyNeural">Guy (Male, Natural)</option>
                <option value="en-US-JennyNeural">Jenny (Female, Conversational)</option>
                <option value="en-US-ChristopherNeural">Christopher (Male, Deep)</option>
            </optgroup>
            <optgroup label="🇬🇧 UK English">
                <option value="en-GB-SoniaNeural">Sonia (Female)</option>
                <option value="en-GB-RyanNeural">Ryan (Male)</option>
            </optgroup>
        </select>

        <textarea id="inputText" placeholder="Paste your AI chat here... (Code blocks, Tables, and Image links will be replaced with 'Please look at the original text')"></textarea>
        
        <button class="primary" id="generateBtn">🔊 Generate Audio</button>
        <div id="status" style="margin-top: 10px; color: #3b82f6; font-size: 14px; font-weight: bold;"></div>
    </div>

    <!-- READER SCREEN -->
    <div class="main-container" id="readerSection" style="display: none;">
        <div class="reader-pane" id="readingContainer"></div>
        <div class="resizer" id="dragMe"></div>
        <div class="notes-pane" id="notesPane">
            <h3>📝 Quick Notes</h3>
            <textarea id="notesArea" placeholder="Type doubts here..."></textarea>
        </div>
    </div>

    <!-- FLOATING CONTROLS -->
    <div class="floating-controls" id="floatingControls">
        <audio id="audioPlayer" controls></audio>
        
        <div class="control-group">
            <button class="btn" id="newBtn" style="background: #ef4444;">📝 New Text</button>
        </div>

        <div class="control-group">
            <button class="btn" id="skipBack">⏪ -</button>
            <input type="number" id="skipSeconds" value="10" min="1" max="60" style="width: 45px; background: #0b1120; color: white; border: 1px solid #475569; border-radius: 4px; padding: 4px; text-align: center;">
            <button class="btn" id="skipForward">⏩ +</button>
        </div>

        <div class="control-group">
            <span style="font-size: 12px; color: #94a3b8;">Speed:</span>
            <input type="range" id="speedSlider" min="0.5" max="3.0" step="0.05" value="1.0">
            <span id="speedValue" class="speed-display">1.0×</span>
        </div>

        <div class="control-group">
            <button class="btn" id="textSizeDown">A-</button>
            <button class="btn" id="textSizeUp">A+</button>
        </div>
    </div>

<script>
// ==========================================
// 1. SETTINGS & LOCAL STORAGE
// ==========================================
const workerUrlInput = document.getElementById('workerUrl');
const apiKeyInput = document.getElementById('apiKey');
const settingsStatus = document.getElementById('settingsStatus');

workerUrlInput.value = localStorage.getItem('ttsWorkerUrl') || '';
apiKeyInput.value = localStorage.getItem('ttsApiKey') || '';

function saveSettings() {
    let url = workerUrlInput.value.trim();
    const key = apiKeyInput.value.trim();
    
    if (!url || !key) {
        settingsStatus.style.color = '#ef4444';
        settingsStatus.textContent = '⚠️ Both URL and Key are required.';
        return;
    }

    if (!url.startsWith('http://') && !url.startsWith('https://')) {
        url = 'https://' + url;
    }
    url = url.replace(/\/$/, ''); 
    if (url.endsWith('/v1/audio/speech')) {
        url = url.replace('/v1/audio/speech', '');
    }

    workerUrlInput.value = url; 
    localStorage.setItem('ttsWorkerUrl', url);
    localStorage.setItem('ttsApiKey', key);
    
    settingsStatus.style.color = '#10b981';
    settingsStatus.textContent = '✅ Settings saved successfully!';
    setTimeout(() => { settingsStatus.textContent = ''; }, 3000);
}

document.getElementById('saveSettings').addEventListener('click', saveSettings);

// ==========================================
// 2. GLOBAL SPACEBAR PAUSE/RESUME
// ==========================================
document.addEventListener('keydown', (e) => {
    const isTyping = ['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName);
    if (e.code === 'Space' && !isTyping) {
        e.preventDefault();
        const player = document.getElementById('audioPlayer');
        if (player.src) {
            if (player.paused) player.play(); else player.pause();
        }
    }
});

// ==========================================
// 3. NOTES & SIDEBAR RESIZER
// ==========================================
const notesArea = document.getElementById('notesArea');
notesArea.value = localStorage.getItem('ttsQuickNotes') || '';
notesArea.addEventListener('input', () => localStorage.setItem('ttsQuickNotes', notesArea.value));

const resizer = document.getElementById('dragMe');
const notesPane = document.getElementById('notesPane');
let isResizing = false;
resizer.addEventListener('mousedown', () => { isResizing = true; document.body.style.cursor = 'col-resize'; });
document.addEventListener('mousemove', (e) => {
    if (!isResizing) return;
    const newWidth = window.innerWidth - e.clientX;
    if (newWidth > 150 && newWidth < 800) notesPane.style.width = `${newWidth}px`;
});
document.addEventListener('mouseup', () => { isResizing = false; document.body.style.cursor = 'default'; });

// ==========================================
// 4. AUDIO CONTROLS
// ==========================================
const audioPlayer = document.getElementById('audioPlayer');
const speedSlider = document.getElementById('speedSlider');
const speedValue = document.getElementById('speedValue');
const readingContainer = document.getElementById('readingContainer');
const inputSection = document.getElementById('inputSection');
const readerSection = document.getElementById('readerSection');
const floatingControls = document.getElementById('floatingControls');
const generateBtn = document.getElementById('generateBtn');

speedSlider.addEventListener('input', () => {
    const speed = parseFloat(speedSlider.value);
    speedValue.textContent = speed.toFixed(1) + '×';
    audioPlayer.playbackRate = speed;
});
audioPlayer.preservesPitch = true;

document.getElementById('skipBack').addEventListener('click', () => {
    audioPlayer.currentTime = Math.max(0, audioPlayer.currentTime - (parseFloat(document.getElementById('skipSeconds').value) || 10));
});
document.getElementById('skipForward').addEventListener('click', () => {
    audioPlayer.currentTime = Math.min(audioPlayer.duration || 9999, audioPlayer.currentTime + (parseFloat(document.getElementById('skipSeconds').value) || 10));
});

let currentTextSize = parseInt(localStorage.getItem('ttsTextSize')) || 22; 
function applyTextSize() {
    readingContainer.style.fontSize = currentTextSize + 'px';
    localStorage.setItem('ttsTextSize', currentTextSize);
}
applyTextSize(); 
document.getElementById('textSizeUp').addEventListener('click', () => { currentTextSize = Math.min(40, currentTextSize + 2); applyTextSize(); });
document.getElementById('textSizeDown').addEventListener('click', () => { currentTextSize = Math.max(16, currentTextSize - 2); applyTextSize(); });

document.getElementById('newBtn').addEventListener('click', () => {
    audioPlayer.pause();
    audioPlayer.src = '';
    readerSection.style.display = 'none';
    floatingControls.style.display = 'none';
    inputSection.style.display = 'flex';
});

// ==========================================
// 5. RENDERING & HIGHLIGHTING
// ==========================================
let lineDivs = [];
let totalChars = 0;
let animationFrameId;

function renderTextForHighlighting(text) {
    readingContainer.innerHTML = '';
    lineDivs = [];
    
    // Split by newline but KEEP all lines (even empty ones) so character counts map perfectly.
    const lines = text.split('\n');
    let currentCharIndex = 0;
    
    lines.forEach((lineText) => {
        const div = document.createElement('div');
        div.className = 'line';
        // If line is empty, use a space so it still takes up vertical room
        div.textContent = lineText.trim() !== '' ? lineText : ' '; 
        
        const thisLineStart = currentCharIndex;
        
        div.addEventListener('click', () => {
            if (!audioPlayer.duration) return;
            // Calculate percentage based on where this line starts
            const percent = thisLineStart / text.length;
            audioPlayer.currentTime = audioPlayer.duration * percent;
            
            lineDivs.forEach(ld => ld.classList.remove('active'));
            div.classList.add('active');
            
            if (audioPlayer.paused) audioPlayer.play();
        });

        readingContainer.appendChild(div);
        
        lineDivs.push({ 
            start: thisLineStart, 
            end: currentCharIndex + lineText.length, 
            el: div 
        });
        
        // +1 for the newline character
        currentCharIndex += lineText.length + 1; 
    });
    totalChars = text.length;
}

function updateHighlight() {
    if (!audioPlayer.paused && audioPlayer.duration) {
        const progress = audioPlayer.currentTime / audioPlayer.duration;
        const currentChar = progress * totalChars;
        let activeDiv = null;
        
        for (let i = 0; i < lineDivs.length; i++) {
            const ld = lineDivs[i];
            if (currentChar >= ld.start && currentChar < ld.end) {
                if (!ld.el.classList.contains('active')) {
                    lineDivs.forEach(d => d.classList.remove('active'));
                    ld.el.classList.add('active');
                    activeDiv = ld.el;
                }
                break;
            }
        }

        if (activeDiv) {
            const containerRect = readingContainer.getBoundingClientRect();
            const divRect = activeDiv.getBoundingClientRect();
            
            if (divRect.top > containerRect.top + (containerRect.height * 0.35) || divRect.bottom < containerRect.top + (containerRect.height * 0.15)) {
                const offset = activeDiv.offsetTop - (readingContainer.clientHeight * 0.30);
                readingContainer.scrollTo({ top: offset, behavior: 'smooth' });
            }
        }
    }
    animationFrameId = requestAnimationFrame(updateHighlight);
}

audioPlayer.addEventListener('play', () => { cancelAnimationFrame(animationFrameId); updateHighlight(); });
audioPlayer.addEventListener('pause', () => cancelAnimationFrame(animationFrameId));

// ==========================================
// 6. PREPROCESSOR
// ==========================================
function preprocessText(raw) {
    let text = raw;
    text = text.replace(/!\[([^\]]*)\]\([^)]+\)/g, ' [Image. Please look at the original text.] ');
    text = text.replace(/<img[^>]+>/g, ' [Image. Please look at the original text.] ');
    text = text.replace(/```[\s\S]*?(```|$)/g, ' [Code block. Please look at the original text.] ');
    text = text.replace(/`([^`]+)`/g, ' [Code snippet. Please look at the original text.] ');

    const lines = text.split('\n');
    const out = [];
    let inTable = false;
    for (let i = 0; i < lines.length; i++) {
        const line = lines[i].trim();
        if (line.startsWith('|')) {
            if (!inTable) { inTable = true; }
        } else {
            if (inTable) {
                out.push(` [Table. Please refer to the original text.] `);
                inTable = false;
            }
            out.push(lines[i]); // Keep original spacing for line breaks
        }
    }
    if (inTable) out.push(` [Table. Please refer to the original text.] `);
    
    return out.join('\n');
}

// ==========================================
// 7. GENERATE (BULLETPROOF CHUNKING)
// ==========================================
generateBtn.addEventListener('click', async () => {
    const statusEl = document.getElementById('status');
    const workerUrl = localStorage.getItem('ttsWorkerUrl');
    const apiKey = localStorage.getItem('ttsApiKey');
    const rawText = document.getElementById('inputText').value.trim();

    if (!workerUrl || !apiKey) {
        statusEl.style.color = '#ef4444';
        statusEl.textContent = '⚠️ Save API Settings first.';
        return;
    }
    if (!rawText) {
        statusEl.style.color = '#ef4444';
        statusEl.textContent = '⚠️ Paste some text.';
        return;
    }

    const processedText = preprocessText(rawText);
    const voice = document.getElementById('voiceSelect').value;
    
    // Bulletproof Chunking (Max 800 chars)
    const chunks = [];
    let remaining = processedText;
    
    while (remaining.length > 0) {
        if (remaining.length <= 800) {
            chunks.push(remaining);
            break;
        }
        // Find the last space within 800 chars to avoid cutting words in half
        let splitIndex = remaining.lastIndexOf(' ', 800);
        if (splitIndex === -1) splitIndex = 800; // If no space found, just cut at 800
        
        chunks.push(remaining.slice(0, splitIndex));
        remaining = remaining.slice(splitIndex).trim();
    }

    generateBtn.disabled = true;
    statusEl.style.color = '#3b82f6';
    statusEl.textContent = `⏳ Generating audio... (0 / ${chunks.length} parts)`;
    const audioBlobs = [];

    try {
        for (let i = 0; i < chunks.length; i++) {
            statusEl.textContent = `⏳ Generating audio... (${i + 1} / ${chunks.length} parts)`;
            
            const response = await fetch(`${workerUrl}/v1/audio/speech`, {
                method: 'POST',
                headers: { 
                    'Authorization': `Bearer ${apiKey}`, 
                    'Content-Type': 'application/json' 
                },
                body: JSON.stringify({ 
                    input: chunks[i], 
                    voice: voice, 
                    speed: 1.0, 
                    stream: false 
                })
            });

            if (!response.ok) {
                throw new Error(`Worker returned ${response.status} on part ${i+1}. Check your Cloudflare dashboard.`);
            }
            
            const blob = await response.blob();
            audioBlobs.push(blob);
        }

        const combinedBlob = new Blob(audioBlobs, { type: 'audio/mpeg' });
        audioPlayer.src = URL.createObjectURL(combinedBlob);
        
        // Render the EXACT processedText that was sent to the API
        renderTextForHighlighting(processedText);
        
        inputSection.style.display = 'none';
        readerSection.style.display = 'flex';
        floatingControls.style.display = 'flex';
        
        audioPlayer.playbackRate = parseFloat(speedSlider.value);
        audioPlayer.play();
        
        statusEl.textContent = '';
        generateBtn.disabled = false;
        
    } catch (err) {
        statusEl.style.color = '#ef4444';
        statusEl.textContent = `❌ Error: ${err.message}`;
        generateBtn.disabled = false;
    }
});
</script>
</body>
</html>
